name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Republie chaque jour pour reprendre les dernières captures d'Atelier
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit des dépendances
        run: npm audit --audit-level=high

      - name: Lint
        run: |
          npx oxlint .
          npx eslint .

      - run: npm test

      # « prebuild » recopie d'abord les captures de docs/captures du dépôt Atelier
      - name: Build
        run: npm run build -- --base=/portefolio-vue/

      # Le site construit est photographié (bureau clair et sombre, téléphone) : une page blanche ou une erreur
      # de script fait échouer la CI, et les images se regardent dans l'artefact du passage
      - name: Captures du site
        run: |
          npx vite preview --base=/portefolio-vue/ --port 4173 --strictPort &
          curl --silent --fail --retry 30 --retry-connrefused --retry-delay 1 --output /dev/null http://localhost:4173/portefolio-vue/
          mkdir -p "$RUNNER_TEMP/pw"
          cp scripts/captures-site.mjs "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium
          CAPTURES_DIR="$GITHUB_WORKSPACE/captures" node captures-site.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-site
          path: captures
          retention-days: 14

      - if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
