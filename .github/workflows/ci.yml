name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Republie chaque jour pour reprendre les dernières captures d'Atelier
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit des dépendances
        run: npm audit --audit-level=high

      - name: Lint
        run: |
          npx oxlint .
          npx eslint .

      - run: npm test

      # « prebuild » recopie d'abord les captures de docs/captures du dépôt Atelier
      - name: Build
        run: npm run build -- --base=/portefolio-vue/

      - if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
